<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
      <form>
          <div class="mb-3">
              <label for="inputTitle" class="form-label">Tytuł</label>
              <input type="text" class="form-control" id="inputTitle" placeholder="Wpisz fragment tytułu"/>
          </div>
          <input id="buttonSearch" type="button" class="btn btn-primary" value="Szukaj" onclick="filterPosts()"/>
      </form>
      <div class="row mt-3">
        <div class="col-md-6">
            <h5>Historia localStorage</h5>
            <ul id="localHistory" class="list-group"></ul>
            <button class="btn btn-danger"
        onclick="localStorage.removeItem('searchHistory'); renderSearchHistory()">
    Wyczyść localStorage
</button>


        </div>
        <div class="col-md-6">
            <h5>Historia sessionStorage</h5>
            <ul id="sessionHistory" class="list-group"></ul>
            <button class="btn btn-warning"
        onclick="sessionStorage.removeItem('searchHistory'); renderSearchHistory()">
    Wyczyść sessionStorage
</button>
        </div>
      </div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Tytuł</th>
          <th>Treść</th>
          <th>Tagi</th>
          <th>Polubienia</th>
          <th>Akcje</th>
          </tr>
      </thead>
      <tbody id="postsBody">
          <tr>
              <td>Wykład z JS</td>
              <td>Dzisiaj wykład o interakcji</td>
              <td>wykład, zajęcia, JS</td>
              <td>10</td>
          </tr>
      </tbody>
    </table>
  <p id="rawJSON"></p>
  <script>
    "use strict";

    let allPosts = [
    ];

    let postsToRender = [

    ]

    function filterPosts() {
        let inputTitle = document.getElementById("inputTitle")
        let filterText = inputTitle.value
        postsToRender = allPosts.filter(
          (post) => post.title.toLowerCase().includes(filterText.toLowerCase()))
        renderPosts(postsToRender)

        if (filterText !== "") {
          saveSearch(localStorage, "searchHistory", filterText);
          saveSearch(sessionStorage, "searchHistory", filterText);
        }

        renderSearchHistory();
    }

    function saveSearch(storage, key, phrase) {
      let history = JSON.parse(storage.getItem(key) || "[]");

      history.push(phrase);

      storage.setItem(key, JSON.stringify(history));
    }

    function renderHistory(storage, key, elementId) {
      const history = JSON.parse(storage.getItem(key) || "[]");
      const list = document.getElementById(elementId);

      list.replaceChildren();

      for (const phrase of history) {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.textContent = phrase;
          list.appendChild(li);
      }
    }

    function renderSearchHistory() {
      renderHistory(localStorage, "searchHistory", "localHistory");
      renderHistory(sessionStorage, "searchHistory", "sessionHistory");
    }

    function renderPosts(posts) {
      let tbody = document.getElementById("postsBody")
      tbody.replaceChildren()

      for (let post of posts) {
          let newRow = document.createElement("tr")
          let newTitle = document.createElement("td")
          newTitle.innerHTML = 
          ` <b>
              <i>${post.title}</i>
            </b>
          `
          newRow.appendChild(newTitle)
          
          let newBody = document.createElement("td")
          newBody.textContent = post.body
          newRow.appendChild(newBody)
          
          let newTags = document.createElement("td")
          let tagsList = "<ul>"
          for (let tag of post.tags) {
              tagsList += "<li>" + tag + "</li>"
          }
          tagsList += "</ul>"
          newTags.innerHTML = tagsList
          newRow.appendChild(newTags)

          let newLikes = document.createElement("td")
          newLikes.textContent = post.reactions.likes
          newRow.appendChild(newLikes)

          let newActions = document.createElement("td");

          let detailsButton = document.createElement("button");
          detailsButton.className = "btn btn-info";
          detailsButton.textContent = "Details";
          detailsButton.addEventListener("click", () => showDetails(post, newRow));
          newActions.appendChild(detailsButton)
          newRow.appendChild(newActions)

          tbody.appendChild(newRow)
      }
    }

    function showDetails(post, row) {
      const alreadyExpanded =
          row.nextElementSibling?.classList.contains("details-row");

      document.querySelectorAll(".details-row").forEach(
          detailsRow => detailsRow.remove()
      );

      if (alreadyExpanded) {
          return;
      }
      
      if (row.nextElementSibling?.classList.contains("details-row")) {
          row.nextElementSibling.remove();
          return;
      }

      let detailsRow = document.createElement("tr");
      detailsRow.className = "details-row";

      let detailsCell = document.createElement("td");
      detailsCell.colSpan = 5;

      detailsCell.innerHTML = `
          <div class="card">
              <div class="card-header">
                  Post #${post.id}
              </div>
              <div class="card-body">
                  <h5 class="card-title"></h5>
                  <p class="card-text"></p>
                  <p class="mb-0">
                      <strong>Views:</strong> ${post.views}
                  </p>
              </div>
          </div>
      `;

      detailsCell.querySelector(".card-title").textContent = post.title;
      detailsCell.querySelector(".card-text").textContent = post.body;

      detailsRow.appendChild(detailsCell);

      row.after(detailsRow);
    }
    async function fetchPosts() {
      try {
        const response = await fetch("https://dummyjson.com/posts");
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        document.querySelector("#rawJSON").textContent = JSON.stringify(data)
        console.log("fetch ok")
        allPosts = data.posts
        postsToRender = allPosts
        renderPosts(postsToRender);
      } catch (error) {
        console.error(error);
      }
    }

    window.addEventListener("load", () => {
      fetchPosts();
      renderSearchHistory();
    });

  </script>
  </div>
</body>
</html>
